name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Hook tests
        run: tests/hook_test.sh
      - name: Generate project
        run: tuist generate --no-open
      - name: App tests
        run: |
          set -o pipefail
          xcodebuild test -workspace Machiai.xcworkspace -scheme Machiai \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            > build-test.log 2>&1 || { grep -n -B2 -A10 'error:' build-test.log | head -80; exit 1; }
          grep -E "Test run with [0-9]+ tests?|\*\* TEST (SUCCEEDED|FAILED) \*\*" build-test.log
          if grep -qE "Test run with 0 tests" build-test.log; then echo "0 tests ran"; exit 1; fi
