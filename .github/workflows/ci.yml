name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes skip the macOS job; a skipped job still reports as success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'App/**'
              - 'hooks/**'
              - 'tests/**'
              - 'Project.swift'
              - 'Tuist.swift'
              - 'Tuist/**'
              - '**/Package.swift'
              - '**/Package.resolved'
              - '.mise.toml'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Hook tests
        run: tests/hook_test.sh
      - name: Generate project
        run: tuist generate --no-open
      - name: App tests
        run: |
          set -o pipefail
          xcodebuild test -workspace Machiai.xcworkspace -scheme Machiai \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            > build-test.log 2>&1 || { grep -n -B2 -A10 'error:' build-test.log | head -80; exit 1; }
          grep -E "Test run with [0-9]+ tests?|\*\* TEST (SUCCEEDED|FAILED) \*\*" build-test.log
          if grep -qE "Test run with 0 tests" build-test.log; then echo "0 tests ran"; exit 1; fi
