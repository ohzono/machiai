version: 2
updates:
  # No Package.swift / Package.resolved in the repo (Tuist project without SPM dependencies),
  # so only GitHub Actions are tracked.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
